<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#161616">
<meta name="robots" content="noindex, nofollow">
<title>练耳</title>
<style>
  :root { --bg:#161616; --card:#232323; --gold:#c9b47a; --gold2:#a8975f; --text:#ece6d6; --dim:#8f897b; --line:#343434; --bad:#d9785f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, "PingFang SC", sans-serif; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  svg { width:100%; height:100%; display:block; }
  .hide { display:none !important; }
  .page { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px); }

  .bar { display:flex; align-items:center; justify-content:space-between; height:56px; margin-bottom:14px; }
  .bar h1 { font-size:24px; margin:0; font-weight:600; }
  .ibtn { width:44px; height:44px; padding:9px; color:#bbb; }

  /* 主页列表 */
  .card { background:var(--card); border-radius:28px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:14px; cursor:pointer; user-select:none; -webkit-user-select:none; }
  .row.top { padding:18px 16px 18px 20px; min-height:92px; }
  .row.top + .row.top, .kids + .row.top { border-top:1px solid var(--line); margin-left:0; }
  .row:active { background:#2b2a26; }
  .icon { width:36px; height:36px; flex:none; color:var(--gold2); display:flex; align-items:center; justify-content:center; }
  .icon .glyph { font-size:34px; line-height:1; }
  .txt { flex:1; min-width:0; }
  .t { font-size:19px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .d { color:var(--dim); font-size:15px; margin-top:3px; }
  .chev { width:26px; height:26px; padding:3px; color:var(--dim); transition:transform .2s; }
  .chev.up { transform:rotate(180deg); }
  .reset { width:40px; height:40px; padding:8px; color:#8a857a; flex:none; white-space:nowrap; }
  .reset.armed { width:auto; padding:0 10px; color:var(--bad); font-size:14px; border:1px solid var(--bad); border-radius:20px; height:32px; }
  .check { width:30px; height:30px; color:var(--gold2); flex:none; }
  .kids { margin-left:50px; }
  .row.kid { padding:12px 16px 12px 20px; border-top:1px solid var(--line); }
  .row.kid .t { font-size:17px; display:inline; }
  .row.kid .n { color:var(--dim); font-size:15px; margin-left:10px; }
  .row.kid .reset { width:34px; height:34px; padding:7px; }
  .foot { text-align:center; color:#57534a; font-size:12px; margin-top:26px; line-height:1.7; }

  /* 练习页 */
  .bar .mid { flex:1; text-align:center; min-width:0; }
  .bar .mid .t { justify-content:center; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .bar .mid .d { font-size:13px; }
  #status { text-align:center; font-size:22px; font-weight:600; min-height:64px; padding:18px 10px 8px; }
  #status.good { color:var(--gold); }
  #status.bad { color:var(--bad); }
  #dots { display:flex; justify-content:center; gap:7px; flex-wrap:wrap; min-height:14px; margin-bottom:14px; }
  #dots i { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--gold2); }
  #dots i.wide { width:26px; border-radius:6px; }
  #dots i.on { background:var(--gold); }
  #answer { background:var(--card); border-radius:22px; padding:18px 20px; text-align:center; margin-bottom:16px; min-height:96px; }
  #answer .inner { visibility:hidden; }
  #answer.shown .inner { visibility:visible; }
  #answer:not(.shown)::before { content:"答案"; color:#4e4b44; display:block; margin-top:20px; position:absolute; left:0; right:0; }
  #answer { position:relative; }
  #atitle { font-size:20px; font-weight:600; color:var(--gold); }
  #anotes { color:var(--dim); margin-top:6px; font-size:15px; word-break:break-word; }

  #keys { position:relative; height:150px; margin:0 -6px 18px; touch-action:none; }
  .wk, .bk { position:absolute; top:0; border-radius:0 0 6px 6px; }
  .wk { height:100%; background:#e9e4d8; border:1px solid #111; }
  .wk span { position:absolute; bottom:4px; left:0; right:0; text-align:center; font-size:9px; color:#888; }
  .bk { height:60%; background:#1c1c1c; border:1px solid #000; z-index:2; }
  .wk.ans { background:#e6cf8e; }
  .bk.ans { background:#8a7440; }
  .wk.down { background:var(--gold) !important; }
  .bk.down { background:#d9bf73 !important; }
  .wk.ans::after, .bk.ans::after { content:""; position:absolute; left:50%; bottom:18px; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:#6b5520; }

  .btns { display:flex; gap:10px; }
  .btns button { flex:1; height:52px; border-radius:16px; background:var(--card); font-size:17px; font-weight:600; }
  .btns button.main { background:var(--gold2); color:#1a1a1a; }
  #btnOk { width:100%; height:52px; border-radius:16px; background:var(--gold); color:#1a1a1a; font-size:17px; font-weight:600; margin-bottom:10px; }
  #midi { text-align:center; color:#6c685e; font-size:13px; margin-top:18px; }
  #midi.ok { color:var(--gold2); }

  /* 回顾 */
  #review .big { background:var(--card); border-radius:28px; padding:50px 20px; text-align:center; margin:30px 0 20px; }
  #rtitle { font-size:28px; font-weight:600; color:var(--gold); }
  #rnotes { color:var(--dim); margin-top:10px; }
  #rcount { color:#5d594f; margin-top:22px; font-size:13px; }

  /* 设置 */
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .sheet { background:#1e1e1e; width:100%; max-width:560px; border-radius:26px 26px 0 0; padding:18px 20px calc(env(safe-area-inset-bottom) + 20px); max-height:85vh; overflow:auto; }
  .sheet h2 { margin:4px 0 10px; font-size:19px; display:flex; justify-content:space-between; align-items:center; }
  .sheet h2 button { color:var(--gold); font-size:16px; }
  .set { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 0; border-top:1px solid var(--line); }
  .set .t { font-size:16px; }
  .set .d { font-size:13px; }
  .set input[type=checkbox] { width:22px; height:22px; accent-color:var(--gold2); flex:none; }
  .set input[type=range] { width:130px; accent-color:var(--gold2); flex:none; }
</style>
</head>
<body>

<div id="home" class="page">
  <div class="bar">
    <button class="ibtn" id="btnSet" title="设置"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v24M16 4v24M24 4v24"/><rect x="5" y="17" width="6" height="5" rx="2" fill="#161616"/><rect x="13" y="8" width="6" height="5" rx="2" fill="#161616"/><rect x="21" y="19" width="6" height="5" rx="2" fill="#161616"/></svg></button>
    <h1>练耳</h1>
    <button class="ibtn fork" title="参考音"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 27l9-9M14 18l3 3M14 18c-2-2 0-5 2-7l8-8M17 21c2 2 5 0 7-2l4-4"/></svg></button>
  </div>
  <div id="list" class="card"></div>
  <div class="foot">在钢琴上弹出你听到的 · 进度存在这台设备上<br>Piano samples: Salamander Grand Piano by Alexander Holm (CC-BY 3.0)</div>
</div>

<div id="practice" class="page hide">
  <div class="bar">
    <button class="ibtn" id="btnBack" title="返回"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L10 16l10 10"/></svg></button>
    <div class="mid"><div class="t" id="ptitle"></div><div class="d" id="pcount"></div></div>
    <button class="ibtn fork" title="参考音"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 27l9-9M14 18l3 3M14 18c-2-2 0-5 2-7l8-8M17 21c2 2 5 0 7-2l4-4"/></svg></button>
  </div>
  <div id="status"></div>
  <div id="dots"></div>
  <div id="answer"><div class="inner"><div id="atitle"></div><div id="anotes"></div></div></div>
  <div id="keys"></div>
  <button id="btnOk" class="hide">确定</button>
  <div class="btns">
    <button id="btnAgain">重听</button>
    <button id="btnReveal">揭晓</button>
    <button id="btnNext" class="main">下一题</button>
  </div>
  <div id="midi"></div>
</div>

<div id="review" class="page hide">
  <div class="bar">
    <button class="ibtn" id="rBack" title="返回"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L10 16l10 10"/></svg></button>
    <div class="mid"><div class="t">回顾</div></div>
    <div style="width:44px"></div>
  </div>
  <div class="big"><div id="rtitle"></div><div id="rnotes"></div><div id="rcount"></div></div>
  <div class="btns"><button id="rPause">暂停</button><button id="rNext" class="main">下一个</button></div>
</div>

<div id="settings" class="hide">
  <div class="sheet"><h2>设置 <button id="setClose">完成</button></h2><div id="setbody"></div></div>
</div>

<script src="lib/Tone.js"></script>
<script src="js/samples.js"></script>
<script src="js/theory.js"></script>
<script src="js/audio.js"></script>
<script src="js/midi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
